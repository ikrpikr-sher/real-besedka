# /etc/nginx/conf.d/besedki-maps.conf
# Кэш только для успешных ответов. 403/404 не должны уходить в Cloudflare как cacheable —
# иначе край снова раздаёт пустые карточки (сбой 28.08 после valid_referers).

map $status $media_cc {
    200     "public, max-age=604800";
    206     "public, max-age=604800";
    304     "public, max-age=604800";
    default "no-store";
}
