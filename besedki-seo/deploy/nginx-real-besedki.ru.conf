# Эталон nginx для real-besedki.ru (VPS 31.128.44.47). NS — Beget, origin без CF-прокси.
# Ставить: scp deploy/nginx-real-besedki.ru.conf root@HOST:/etc/nginx/sites-enabled/real-besedki.ru
#          nginx -t && systemctl reload nginx
# НЕ выкладывать копию без location карточки (og:type=website → product).
# Схема: besedki-seo/docs/CLOUDFLARE-SCHEME.md
#
# ЗАПРЕЩЕНО:
# - блокировка картинок по Referer (403 чужому источнику) на /images /videos /avito/images
#   Cloudflare кэширует 403 → пустые карточки, белый экран Android, Safari «не открывается».
# - отдавать корень сайта статическим HTML вместо Next.js — ломает мобильную навигацию.
# - слушать HTTP/3 на origin (h3 только у края; у нас HTTP/3 в CF выключен).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name real-besedki.ru m.real-besedki.ru;

    ssl_certificate /etc/letsencrypt/live/real-besedki.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/real-besedki.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 500M;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Accept-Encoding сбрасывается у proxy (sub_filter). Сжимаем уже после фильтра.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    location = /ok.html {
        alias /var/www/besedki/public/ok.html;
        default_type text/html;
        add_header Cache-Control "no-store";
        charset utf-8;
    }

    location = /yandex_36f8ff18a456a0f6.html {
        alias /var/www/besedki/public/yandex_36f8ff18a456a0f6.html;
        default_type text/html;
        add_header Cache-Control "no-store";
        charset utf-8;
    }

    location = /zen_Xyo3l7VY245HuojnPCBQ67is5Nv5ZNnxsohJDQzSOoSIHTiGNVUNx88bwqFfHJVI.html {
        alias /var/www/besedki/public/zen_Xyo3l7VY245HuojnPCBQ67is5Nv5ZNnxsohJDQzSOoSIHTiGNVUNx88bwqFfHJVI.html;
        default_type text/html;
        add_header Cache-Control "no-store";
        charset utf-8;
    }

    location = /b43902a3b8cb22e0f20c4ca1cd82ec8a.txt {
        alias /var/www/besedki/public/b43902a3b8cb22e0f20c4ca1cd82ec8a.txt;
        default_type text/plain;
        add_header Cache-Control "no-store";
        charset utf-8;
    }

    location /models/ {
        alias /var/www/besedki/public/models/;
        expires 30d;
        add_header Cache-Control $media_cc always;
        access_log off;
    }

    location /docs/ {
        alias /var/www/besedki/public/docs/;
        types { application/pdf pdf; text/html html; }
        add_header Cache-Control $media_cc always;
        access_log off;
    }

    # Фото и видео: всегда 200 своим файлам. Без проверки Referer.
    location /images/ {
        alias /var/www/besedki/public/images/;
        expires 7d;
        add_header Cache-Control $media_cc always;
        add_header Content-Disposition "inline";
        access_log /var/log/nginx/besedki-images.log;
    }

    location /videos/ {
        alias /var/www/besedki/public/videos/;
        expires 7d;
        add_header Cache-Control $media_cc always;
        add_header Content-Disposition "inline";
        access_log off;
    }

    location /avito/images/ {
        alias /var/www/besedki/public/avito/images/;
        default_type image/jpeg;
        expires 30d;
        add_header Cache-Control $media_cc always;
        add_header Content-Disposition "inline";
        access_log off;
    }

    location /avito/ {
        alias /var/www/besedki/public/avito/;
        default_type application/xml;
        add_header Cache-Control $media_cc always;
        access_log off;
    }

    # /proekty — портфолио моделей (Next.js), не редирект на каталог

    location /_next/static/ {
        proxy_cache besedki_cache;
        proxy_cache_valid 200 365d;
        proxy_cache_lock off;
        proxy_cache_key "$scheme$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:3000;
    }

    # static-home disabled: caused broken mobile navigation (no Next.js scripts)
    # location = / { ... }

    location ^~ /admin {
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }

    location @besedki_next {
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }

    location ~ ^/blog/\._ { return 404; }
    location = /blog/category/undefined { return 404; }
    location = /blog/category/sovety { return 301 https://real-besedki.ru/blog; }
    location = /blog/category/sovety/ { return 301 https://real-besedki.ru/blog; }
    # Пустые leftover-рубрики (200 + H1=slug, нет в sitemap) → /blog
    location ~ ^/blog/category/(proizvodstvo|soveti|novosti|obzory|news|statyi|stati|video|otzyvy|reviews|materialy|ukhod|proizvodstvo-i-kachestvo|obzory-i-sravneniya)/?$ {
        return 301 https://real-besedki.ru/blog;
    }

    # Старые индексированные slug после переезда B-51 и категории лофт
    location = /katalog/besedki-s-ostekleniem/b-51 { return 301 https://real-besedki.ru/katalog/otkrytye-besedki/b-51; }
    location = /katalog/besedki-s-ostekleniem/b-51/ { return 301 https://real-besedki.ru/katalog/otkrytye-besedki/b-51; }
    location = /katalog/besedki-s-mangalom/b-51 { return 301 https://real-besedki.ru/katalog/otkrytye-besedki/b-51; }
    location = /katalog/besedki-s-mangalom/b-51/ { return 301 https://real-besedki.ru/katalog/otkrytye-besedki/b-51; }

    location = /catalog { return 301 https://real-besedki.ru/katalog; }
    location = /portfolio { return 301 https://real-besedki.ru/o-kompanii; }
    location = /dostavka-i-oplata { return 301 https://real-besedki.ru/kontakty; }

    # Короткие display URL объявлений → живые посадки (без 404 с телефона)
    location = /loft { return 301 https://real-besedki.ru/besedka-loft; }
    location = /loft/ { return 301 https://real-besedki.ru/besedka-loft; }
    location = /panorama { return 301 https://real-besedki.ru/besedka-panorama; }
    location = /panorama/ { return 301 https://real-besedki.ru/besedka-panorama; }
    location = /zakrytaya { return 301 https://real-besedki.ru/zakrytaya-besedka; }
    location = /zakrytaya/ { return 301 https://real-besedki.ru/zakrytaya-besedka; }
    location = /zimnyaya { return 301 https://real-besedki.ru/zimnyaya-besedka; }
    location = /zimnyaya/ { return 301 https://real-besedki.ru/zimnyaya-besedka; }
    location = /otkrytaya { return 301 https://real-besedki.ru/otkrytaya-besedka; }
    location = /otkrytaya/ { return 301 https://real-besedki.ru/otkrytaya-besedka; }
    location = /steklo { return 301 https://real-besedki.ru/osteklennaya-besedka; }
    location = /steklo/ { return 301 https://real-besedki.ru/osteklennaya-besedka; }
    location = /2x2 { return 301 https://real-besedki.ru/besedka-2x2; }
    location = /2x2/ { return 301 https://real-besedki.ru/besedka-2x2; }
    location = /2x3 { return 301 https://real-besedki.ru/besedka-2x3; }
    location = /2x3/ { return 301 https://real-besedki.ru/besedka-2x3; }
    location = /3x3 { return 301 https://real-besedki.ru/besedka-3x3; }
    location = /3x3/ { return 301 https://real-besedki.ru/besedka-3x3; }
    location = /3x4 { return 301 https://real-besedki.ru/besedka-3x4; }
    location = /3x4/ { return 301 https://real-besedki.ru/besedka-3x4; }
    location = /3х4 { return 301 https://real-besedki.ru/besedka-3x4; }
    location = /4x4 { return 301 https://real-besedki.ru/besedka-4x4; }
    location = /4x4/ { return 301 https://real-besedki.ru/besedka-4x4; }
    location = /4x3 { return 301 https://real-besedki.ru/besedka-4x3; }
    location = /4x3/ { return 301 https://real-besedki.ru/besedka-4x3; }
    location = /5x4 { return 301 https://real-besedki.ru/besedka-5x4; }
    location = /5x4/ { return 301 https://real-besedki.ru/besedka-5x4; }
    location = /5x5 { return 301 https://real-besedki.ru/besedka-5x5; }
    location = /5x5/ { return 301 https://real-besedki.ru/besedka-5x5; }
    location = /6x3 { return 301 https://real-besedki.ru/besedka-6x3; }
    location = /6x3/ { return 301 https://real-besedki.ru/besedka-6x3; }
    location = /raschet { return 301 https://real-besedki.ru/#raschet; }
    location = /raschet/ { return 301 https://real-besedki.ru/#raschet; }
    location = /besedka-3-na-3 { return 301 https://real-besedki.ru/besedka-3x3; }
    location = /besedka-3-na-4 { return 301 https://real-besedki.ru/besedka-3x4; }
    location = /besedka-4-na-4 { return 301 https://real-besedki.ru/besedka-4x4; }
    location = /besedka-4-na-3 { return 301 https://real-besedki.ru/besedka-4x3; }
    location = /besedka-2-na-2 { return 301 https://real-besedki.ru/besedka-2x2; }
    location = /besedka-2-na-3 { return 301 https://real-besedki.ru/besedka-2x3; }
    location = /besedka-6-na-3 { return 301 https://real-besedki.ru/besedka-6x3; }
    location = /besedka-6-na-6 { return 301 https://real-besedki.ru/besedka-6x6; }
    location = /besedka-5-na-5 { return 301 https://real-besedki.ru/besedka-5x5; }
    location = /besedka-6-na-4 { return 301 https://real-besedki.ru/besedka-6x4; }
    location = /besedki-iz-metalla { return 301 https://real-besedki.ru/besedka-iz-metalla; }
    location = /besedka-metallicheskaya { return 301 https://real-besedki.ru/metallicheskaya-besedka; }
    location = /besedka-kovanaya { return 301 https://real-besedki.ru/besedka-iz-metalla; }
    location = /naves-besedka { return 301 https://real-besedki.ru/besedka-naves; }
    location = /besedka-s-grilom { return 301 https://real-besedki.ru/besedka-s-barbekyu; }
    location = /besedka-iz-metalla/ { return 301 https://real-besedki.ru/besedka-iz-metalla; }
    location = /metallicheskaya-besedka/ { return 301 https://real-besedki.ru/metallicheskaya-besedka; }

    location = /manifest.webmanifest {
        alias /var/www/besedki/public/manifest.webmanifest;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /icon-192.png {
        alias /var/www/besedki/public/icon-192.png;
        default_type image/png;
        expires 30d;
    }

    location = /icon-512.png {
        alias /var/www/besedki/public/icon-512.png;
        default_type image/png;
        expires 30d;
    }

    location = /photo-protect.js {
        alias /var/www/besedki/public/photo-protect.js;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=86400";
    }

    # Запасной CSS с диска. Next standalone не отдаёт файлы, дописанные в public/ после сборки.
    # Без этого location Cloudflare кэширует 404 — на телефоне страница без стилей и hero.
    location = /site.css {
        alias /opt/besedki-ops/site.css;
        default_type text/css;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location = /pavilion-vent.js {
        alias /opt/besedki-ops/pavilion-vent.js;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=60";
    }

    location = /home-workshop-video.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 204;
    }

    location = /api/admin/login {
        limit_req zone=adminlogin burst=3 nodelay;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /internal-ops {
        return 301 /internal-ops/;
    }

    location ^~ /internal-ops/ {
        limit_req zone=ops burst=20 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Ops-Token $http_x_ops_token;
        proxy_pass http://127.0.0.1:43180/;
    }

    # Next.js 14 отклоняет Metadata openGraph.type=product. Меняем только карточки.
    location ~ ^/katalog/(otkrytye-besedki|besedki-s-ostekleniem|besedki-osteklennye-loft|besedki-s-mangalom|navesy|mangaly|kacheli|pavilony)/[A-Za-z0-9_-]+/?$ {
        set $nocache 0;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Length;
        proxy_cache besedki_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_bypass $nocache $http_rsc $http_next_router_prefetch $http_pragma $arg_fresh;
        proxy_no_cache $nocache $http_rsc $http_next_router_prefetch $arg_fresh;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        proxy_hide_header X-Powered-By;
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter 'property="og:type" content="website"' 'property="og:type" content="product"';
        sub_filter '<link rel="preload" as="image" href="https://mc.yandex.ru/watch/111500128"/>' '';
        sub_filter '</head>' '<meta name="yandex-verification" content="36f8ff18a456a0f6"/><meta name="zen-verification" content="Xyo3l7VY245HuojnPCBQ67is5Nv5ZNnxsohJDQzSOoSIHTiGNVUNx88bwqFfHJVI"/><meta name="p:domain_verify" content="2615e9e3726346517a6d030487fec47f"/><link rel="manifest" href="/manifest.webmanifest"/><style id="rb-photo-protect">html,body{overflow-x:clip!important;overscroll-behavior-y:auto!important}img,picture,video{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.card img{height:100%!important;width:100%!important;object-fit:cover}</style></head>';
        sub_filter '</body>' '<script src="/photo-protect.js" defer></script></body>';
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_intercept_errors on;
        error_page 502 503 504 /ok.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        # Не кэшировать API и RSC-prefetch. Остальной HTML — 60 с, иначе телефон ждёт origin 10–15 с.
        set $nocache 0;
        if ($uri ~ ^/api/) { set $nocache 1; }
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Length;
        proxy_cache besedki_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_bypass $nocache $http_rsc $http_next_router_prefetch $http_pragma $arg_fresh;
        proxy_no_cache $nocache $http_rsc $http_next_router_prefetch $arg_fresh;
        add_header X-Cache-Status $upstream_cache_status always;
        # no-store: иначе Chrome iOS при «потянуть вниз» показывает тот же HTML из кэша.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        proxy_hide_header X-Powered-By;
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        # Ремень: Next больше не должен эмитить этот preload (Analytics.tsx). Строка безопасна, если его нет.
        sub_filter '<link rel="preload" as="image" href="https://mc.yandex.ru/watch/111500128"/>' '';
        sub_filter_once on;
        sub_filter '</head>' '<meta name="yandex-verification" content="36f8ff18a456a0f6"/><meta name="zen-verification" content="Xyo3l7VY245HuojnPCBQ67is5Nv5ZNnxsohJDQzSOoSIHTiGNVUNx88bwqFfHJVI"/><meta name="p:domain_verify" content="2615e9e3726346517a6d030487fec47f"/><link rel="manifest" href="/manifest.webmanifest"/><style id="rb-photo-protect">html,body{overflow-x:clip!important;overscroll-behavior-y:auto!important}img,picture,video{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.card img{height:100%!important;width:100%!important;object-fit:cover}</style></head>';
        # Только photo-protect. НЕ вставлять pavilion-vent.js / home-workshop-video.js (8 МБ видео + MutationObserver).
        sub_filter '</body>' '<script src="/photo-protect.js" defer></script></body>';
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_intercept_errors on;
        error_page 502 503 504 /ok.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.real-besedki.ru;

    ssl_certificate /etc/letsencrypt/live/real-besedki.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/real-besedki.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://real-besedki.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name real-besedki.ru www.real-besedki.ru m.real-besedki.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://real-besedki.ru$request_uri;
    }
}
