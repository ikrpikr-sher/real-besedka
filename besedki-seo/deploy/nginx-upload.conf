# Подключить внутри server { } перед location /:
#   client_max_body_size 20M;
#   proxy_read_timeout 120s;
#   proxy_send_timeout 120s;
#
# Загруженные через админку фото лежат в public/images/ и должны
# отдаваться nginx напрямую — иначе next start не видит новые файлы до рестарта PM2.
#
#   location /images/ {
#       alias /var/www/besedki/public/images/;
#       expires 7d;
#       add_header Cache-Control "public";
#       access_log off;
#   }
#
# Видео — аналогично:
#   client_max_body_size 500M;
#
#   location /videos/ {
#       alias /var/www/besedki/public/videos/;
#       expires 7d;
#       add_header Cache-Control "public";
#       access_log off;
#   }
