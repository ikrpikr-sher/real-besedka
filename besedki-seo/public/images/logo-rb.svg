<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-label="Реал Беседки — real-besedki.ru">
  <rect width="640" height="800" fill="#1a1714"/>

  <!-- Вальмовая крыша беседки + геометрическая рамка в ключе Realzont -->
  <g fill="none" stroke="#f4efe6" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Рамка -->
    <path d="M205 175 L205 105 L435 105 L435 205"/>

    <!-- Конёк -->
    <line x1="285" y1="128" x2="355" y2="128"/>

    <!-- Передний скат (трапеция вальмы) -->
    <path d="M250 205 L285 128 L355 128 L390 205 Z"/>

    <!-- Левая и правая вальмы (диагонали рёбер) -->
    <line x1="250" y1="205" x2="285" y2="128"/>
    <line x1="390" y1="205" x2="355" y2="128"/>

    <!-- Карниз -->
    <line x1="235" y1="205" x2="405" y2="205"/>

    <!-- Лёгкая стойка по центру — намёк на каркас 80×80, не зонт -->
    <line x1="320" y1="205" x2="320" y2="235"/>
  </g>

  <text
    x="320"
    y="400"
    text-anchor="middle"
    fill="#f4efe6"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="210"
    font-weight="700"
    letter-spacing="-8"
  >RB</text>

  <text
    x="320"
    y="530"
    text-anchor="middle"
    fill="#f4efe6"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="40"
    font-weight="500"
  >real-besedki.ru</text>
</svg>
